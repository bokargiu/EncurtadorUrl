<div class="content">
    <h1>Encurtador de URL</h1>
    <input type="text" placeholder="Digite a URL para encurtar" [(ngModel)]="url" />
    <button (click)="sendUrl()">Encurtar</button>

    @if (shortUrl !== '')
    {
        <div class="result">
            <p>{{ shortUrl }}</p>
        </div>
    }
</div>
